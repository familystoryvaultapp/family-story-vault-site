<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Respond to a Family Story Vault memory request."><title>Share a Memory — Family Story Vault</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="respond.css"></head>
<body class="response-page"><header class="site-header"><div class="shell nav-wrap"><a class="brand" href="index.html"><img class="brand-logo" src="assets/family-story-vault-logo.png" alt="Family Story Vault"></a></div></header>
<main class="response-shell"><section id="request-card" class="response-card" hidden><p class="eyebrow" id="requester"></p><h1>Share a Memory</h1><p id="vault" class="response-meta"></p><p id="subject" class="response-subject"></p><blockquote id="question"></blockquote><p id="personal-message" class="response-message"></p><p id="context"></p>
<form id="response-form"><label for="contributor-name">Your name</label><input id="contributor-name" maxlength="160" autocomplete="name" required><label for="memory">Your memory</label><textarea id="memory" maxlength="200000" required placeholder="Write your memory here. You can use several paragraphs."></textarea><button class="button button-primary response-button" type="submit">Create Response File</button></form>
<a id="download" class="button button-secondary response-button" hidden>Download Response File</a><div id="status" role="status" aria-live="polite"></div><p class="response-privacy">Your request and response stay in this browser. Nothing is uploaded by this page. You choose when and how to send the response file back.</p></section>
<section id="request-error" class="response-card" hidden><h1>This memory request could not be opened.</h1><p id="error-detail">Ask the sender to share a new Family Story Vault memory-request link.</p></section></main><script src="respond.js"></script></body></html>
